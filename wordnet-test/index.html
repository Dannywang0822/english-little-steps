<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex"><title>词汇网 · 测试版（初一–初三）</title>
<style>
body{margin:0;font-family:-apple-system,"PingFang SC",sans-serif;background:#f6f7fb;color:#222}
header{background:#4f7cff;color:#fff;padding:14px 16px}header h1{margin:0;font-size:18px}header p{margin:4px 0 0;font-size:12px;opacity:.85}
nav{display:flex;position:sticky;top:0;background:#fff;box-shadow:0 1px 3px #0001;z-index:2}
nav button{flex:1;padding:12px;border:0;background:none;font-size:15px;border-bottom:3px solid transparent}
nav button.on{border-color:#4f7cff;color:#4f7cff;font-weight:600}
main{padding:12px;max-width:640px;margin:auto}.card{background:#fff;border-radius:12px;padding:12px;margin-bottom:12px;box-shadow:0 1px 3px #0001}
h3{margin:0 0 8px;font-size:16px}.w{display:inline-block;margin:3px;padding:5px 9px;border-radius:14px;background:#eef2ff;font-size:14px;cursor:pointer}
.w.x{background:#ffe9c7}.zh{color:#888;font-size:12px}.lit{display:inline-block;width:14px;height:14px;border-radius:3px;background:#ddd;margin:1px}.lit.on{background:#ffc53d}
.btn{background:#4f7cff;color:#fff;border:0;border-radius:8px;padding:10px 16px;font-size:15px;margin:4px 4px 0 0}
input{font-size:16px;padding:8px;border:1px solid #ccc;border-radius:8px;width:60%}.opt{display:block;width:100%;text-align:left;background:#eef2ff;color:#222}.opt.sel{background:#4f7cff;color:#fff}
.ok{color:#1a9b4b}.bad{color:#d33}.hl{outline:2px solid #ff8a00}small{color:#888}
</style></head><body>
<header><h1>词汇网 · 测试版（初一–初三 / KET–PET）</h1><p>游客模式 · 进度只存在本机 · 不登录、不上传</p></header>
<nav><button data-t="net" class="on">词义网</button><button data-t="aff">前后缀</button><button data-t="ex">今日练习</button></nav>
<main id="m"></main>
<script>
const LS='wn_test_v1',N=[1,3,7,14,30,60],H=[1,2,4,7,14],DAY=864e5;
let D,S=JSON.parse(localStorage.getItem(LS)||'{}');S.cards=S.cards||{};S.lit=S.lit||{};
const save=()=>localStorage.setItem(LS,JSON.stringify(S));const m=document.getElementById('m');
let affWords=new Set(),netWords=new Set();
fetch('data.json').then(r=>r.json()).then(d=>{D=d;
d.antonyms.forEach(a=>{netWords.add(a[0]);netWords.add(a[1])});d.groups.forEach(g=>{netWords.add(g.hyper);g.items.forEach(i=>netWords.add(i[0]))});
d.affixes.forEach(a=>a.words.forEach(w=>{affWords.add(w[2]);affWords.add(w[0].replace(/\(e\)/,'e'));affWords.add(w[1])}));show('net')});
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>show(b.dataset.t));
function show(t,focus){document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t==t));
({net:renderNet,aff:renderAff,ex:renderEx})[t]();if(focus){const e=document.querySelector(`[data-w="${focus}"]`);if(e){e.classList.add('hl');e.scrollIntoView({block:'center'})}}else scrollTo(0,0)}
function chip(w,zh,other){const x=other.has(w);return `<span class="w${x?' x':''}" data-w="${w}" ${x?`onclick="show('${other===affWords?'aff':'net'}','${w}')"`:''}>${w} <span class="zh">${zh||''}</span>${x?' ↗':''}</span>`}
function lits(fam,n){const k=S.lit[fam]||[];return Array.from({length:n},(_,i)=>`<span class="lit${i<k.length?' on':''}"></span>`).join('')}
function renderNet(){let h='<div class="card"><small>橙色带 ↗ 的词在「前后缀」里也有，点一下跳过去。</small></div><div class="card"><h3>反义词 ↔ '+lits('反义',D.antonyms.length)+'</h3>';
D.antonyms.forEach(a=>h+=`<div>${chip(a[0],a[2],affWords)} ↔ ${chip(a[1],a[3],affWords)}</div>`);h+='</div>';
D.groups.forEach(g=>{h+=`<div class="card"><h3>${chip(g.hyper,g.zh,affWords)} 包括： ${lits(g.hyper,g.items.length)}</h3>`+g.items.map(i=>chip(i[0],i[1],affWords)).join('')+'</div>'});m.innerHTML=h}
function renderAff(){let h='<div class="card"><small>词根 + 前后缀 = 新词。橙色 ↗ 的词在「词义网」里也有。</small></div>';
D.affixes.forEach(a=>{h+=`<div class="card"><h3>${a.affix}（${a.type}：${a.mean}） ${lits(a.affix,a.words.length)}</h3>`+a.words.map(w=>`<div>${a.type=='前缀'?`<b>${w[0]}</b> + ${w[1]}`:`${w[0]} + <b>${w[1]}</b>`} = ${chip(w[2],w[3],netWords)}</div>`).join('')+'</div>'});m.innerHTML=h}
// questions
function allQ(){const q=[];D.antonyms.forEach(a=>{q.push({id:'ant:'+a[0],fam:'反义',w:a[0],t:'ant',p:`写出 <b>${a[0]}</b>（${a[2]}）的反义词`,ans:[a[1]]})});
D.groups.forEach(g=>q.push({id:'hyp:'+g.hyper,fam:g.hyper,w:g.hyper,t:'hyp',g}));
D.affixes.forEach(a=>a.words.forEach(w=>q.push({id:'aff:'+w[2],fam:a.affix,w:w[2],t:'aff',a,wd:w})));return q}
function due(c){return !c||c.due<=Date.now()}
function pick(){const q=allQ(),now=Date.now();const d=q.filter(x=>S.cards[x.id]&&due(S.cards[x.id]));const n=q.filter(x=>!S.cards[x.id]).sort(()=>Math.random()-.5);
return d.sort(()=>Math.random()-.5).slice(0,8).concat(n).slice(0,8)}
function grade(q,ok){const c=S.cards[q.id]||{s:0,wrong:0};if(ok){const iv=c.wrong>=3?H:N;c.due=Date.now()+iv[Math.min(c.s,iv.length-1)]*DAY;c.s++;
const L=S.lit[q.fam]=S.lit[q.fam]||[];if(!L.includes(q.w))L.push(q.w)}else{c.wrong++;c.s=0;c.due=Date.now()+DAY}S.cards[q.id]=c;save()}
let set,i,score;function renderEx(){set=pick();i=0;score=0;const dn=allQ().filter(x=>S.cards[x.id]&&due(S.cards[x.id])).length;
m.innerHTML=`<div class="card"><h3>今日练习（约 2–4 分钟，${set.length} 题）</h3><small>到期复习 ${dn} 题优先。间隔 1/3/7/14/30/60 天；错满 3 次的词改用 1/2/4/7/14 天。不影响打卡。</small><br><button class="btn" onclick="nextQ()">开始</button></div>`}
function nextQ(){if(i>=set.length){m.innerHTML=`<div class="card"><h3>完成！答对 ${score}/${set.length}</h3><small>点亮的格子在「词义网」「前后缀」里能看到。</small><br><button class="btn" onclick="renderEx()">再来一组</button></div>`;return}
const q=set[i];let h=`<div class="card"><small>${i+1}/${set.length}</small><h3>`;
if(q.t=='ant')h+=q.p+`</h3><input id="in" autocomplete="off" autocapitalize="off"><button class="btn" onclick="chk()">确定</button>`;
else if(q.t=='hyp'){const others=D.groups.filter(g=>g!==q.g).flatMap(g=>g.items).sort(()=>Math.random()-.5).slice(0,3);const right=q.g.items.slice().sort(()=>Math.random()-.5).slice(0,2);q.ans=right.map(x=>x[0]);
h+=`选出 2 个属于 <b>${q.g.hyper}</b>（${q.g.zh}）的词</h3>`+right.concat(others).sort(()=>Math.random()-.5).map(x=>`<button class="btn opt" data-v="${x[0]}" onclick="this.classList.toggle('sel')">${x[0]}</button>`).join('')+`<button class="btn" onclick="chk()">确定</button>`}
else{const a=q.a,w=q.wd,opts=[w[3]].concat(D.affixes.flatMap(x=>x.words).filter(x=>x!==w).sort(()=>Math.random()-.5).slice(0,2).map(x=>x[3])).sort(()=>Math.random()-.5);q.ans=[w[3]];
h+=`<b>${w[2]}</b> = ${w[0]} + ${w[1]}，猜猜意思？</h3><small>提示：${a.affix} 表示「${a.mean}」</small>`+opts.map(o=>`<button class="btn opt" onclick="chk('${o}')">${o}</button>`).join('')}
m.innerHTML=h+'<div id="fb"></div></div>';const inp=document.getElementById('in');if(inp){inp.focus();inp.onkeydown=e=>e.key=='Enter'&&chk()}}
function chk(v){const q=set[i];let ok;if(q.t=='ant')ok=q.ans.includes(document.getElementById('in').value.trim().toLowerCase());
else if(q.t=='hyp'){const s=[...document.querySelectorAll('.opt.sel')].map(b=>b.dataset.v);ok=s.length==2&&s.every(x=>q.g.items.some(y=>y[0]==x))}else ok=v==q.ans[0];
grade(q,ok);if(ok)score++;document.querySelectorAll('.card button').forEach(b=>b.disabled=true);
document.getElementById('fb').innerHTML=`<p class="${ok?'ok':'bad'}">${ok?'✓ 答对了':'✗ 答案：'+(q.t=='hyp'?q.g.items.map(x=>x[0]).join(' / '):q.ans.join(' / '))}</p><button class="btn" onclick="i++;nextQ()">下一题</button>`}
</script></body></html>
