<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="description" content="周六俱乐部第1篇试读页（测试，不列入搜索）" />
  <title>Saturday Club — Weekend 1: The Message on the Board（周六俱乐部·第1篇《黑板上的留言》）</title>
  <style>
    :root {
      --bg:#f4f6fb; --card:#fff; --text:#1a2233; --muted:#8a94a6;
      --primary:#4f6ef7; --primary-soft:#eef2ff; --green:#12b76a; --green-soft:#ecfdf3;
      --orange:#f79009; --orange-soft:#fffaeb; --red:#f04438; --red-soft:#fef3f2;
      --border:#e7ebf3; --radius:16px; --shadow:0 6px 22px rgba(26,34,51,.06);
    }
    * { box-sizing:border-box; margin:0; padding:0 }
    body {
      font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
      background:var(--bg); color:var(--text); font-size:15px; line-height:1.5;
      min-height:100vh; padding-bottom:32px;
    }
    .wrap { max-width:430px; margin:0 auto }
    .top {
      background:linear-gradient(155deg,#4f6ef7,#7b93ff 55%,#a8b8ff);
      color:#fff; padding:22px 18px 24px; border-radius:0 0 22px 22px;
    }
    .top .hi { font-size:13px; opacity:.9 }
    .top h1 { font-size:22px; font-weight:700; margin:4px 0 }
    .top .sub { font-size:12px; opacity:.88 }
    .top .sub-en { font-size:12px; opacity:.92; margin-top:4px; font-weight:600 }
    #main { padding:0 14px 12px }
    .notice {
      margin:12px 0 0; background:var(--orange-soft); color:#7a4d00;
      border-radius:12px; padding:10px 12px; font-size:12.5px; line-height:1.55;
    }
    .card-block {
      background:var(--card); border-radius:var(--radius); padding:18px 16px;
      box-shadow:var(--shadow); margin-top:12px;
    }
    .label { font-size:12px; font-weight:700; color:var(--muted); margin-bottom:6px }
    .scene-title { font-size:18px; font-weight:700; margin:0 0 8px; line-height:1.35 }
    .hint-line { font-size:13px; color:var(--muted); margin:0 0 10px }
    .dots { display:flex; gap:6px; margin-bottom:10px }
    .dot { width:8px; height:8px; border-radius:50%; background:var(--border) }
    .dot.on { background:var(--primary) }
    .story { margin-top:4px }
    .sent {
      margin:0 -6px; padding:8px 6px; border-radius:12px; cursor:pointer;
    }
    .sent:hover, .sent:focus { background:var(--bg); outline:none }
    .sent.open { background:var(--bg) }
    .sent-en { font-size:17px; line-height:1.8; color:var(--text) }
    .sent-zh { display:none; font-size:13px; color:var(--muted); line-height:1.6; margin-top:4px }
    .sent.open .sent-zh { display:block }
    .chunk {
      font: inherit; color: inherit; display: inline; padding: 0 2px; margin: 0;
      border: none; cursor: pointer; border-radius: 4px; line-height: inherit;
      background: transparent; vertical-align: baseline;
    }
    .chunk-new {
      background: var(--primary-soft);
      box-shadow: inset 0 -2px 0 var(--primary);
      font-weight: 650;
    }
    .chunk-recycled {
      box-shadow: none;
      background: transparent;
      border-bottom: 1.5px dashed var(--muted);
      border-radius: 0;
      padding: 0 1px;
    }
    .btn {
      border:none; border-radius:12px; font-family:inherit; font-weight:600;
      font-size:14px; padding:12px 14px; cursor:pointer;
    }
    .btn:active { opacity:.9; transform:scale(.98) }
    .btn:disabled { opacity:.4; cursor:default; transform:none }
    .btn-primary { background:var(--primary); color:#fff }
    .btn-ghost { background:var(--bg); color:var(--text) }
    .btn-green { background:var(--green); color:#fff }
    .btn-full { width:100% }
    .btn-row { display:flex; gap:8px; margin-top:12px }
    .btn-row .btn { flex:1 }
    .linkish {
      display:block; width:100%; margin-top:12px; background:none; border:none;
      font-family:inherit; font-size:13px; color:var(--muted); cursor:pointer; text-align:center;
      padding:8px;
    }
    textarea, input[type=text] {
      box-sizing:border-box; width:100%; padding:12px 12px; border:1.5px solid var(--border);
      border-radius:12px; font-size:16px; font-family:inherit; outline:none; background:#fff;
      -webkit-appearance:none; appearance:none; color:var(--text);
    }
    textarea { resize:vertical; min-height:84px; line-height:1.5 }
    textarea:focus, input[type=text]:focus { border-color:var(--primary) }
    .model {
      margin-top:12px; background:var(--green-soft); border-radius:12px; padding:10px 12px;
    }
    .model p { font-size:14px; font-weight:600 }
    .model .zh { font-size:13px; font-weight:400; color:#166534; margin-top:4px }
    .retell-card { margin-top:12px; padding-top:10px; border-top:1px solid var(--border) }
    .retell-card:first-of-type { border-top:none; padding-top:0 }
    .retell-card h3 { font-size:16px; margin-bottom:4px }
    .bank { display:flex; flex-wrap:wrap; gap:6px; margin-top:8px }
    .bank button {
      border:1.5px solid var(--border); background:#fff; border-radius:999px;
      padding:4px 10px; font-size:13px; font-family:inherit; cursor:pointer;
    }
    .bank button:active { background:var(--primary-soft); border-color:var(--primary) }
    .picks { display:flex; flex-direction:column; gap:8px; margin:8px 0 14px }
    .pick {
      text-align:left; border:1.5px solid var(--border); background:#fff; border-radius:14px;
      padding:12px 14px; font-family:inherit; font-size:14px; font-weight:600; cursor:pointer; color:var(--text);
    }
    .pick.on { border-color:var(--primary); background:var(--primary-soft); color:var(--primary) }
    .pick.done { border-color:#86efac; background:var(--green-soft) }
    .hint-box { font-size:12px; color:var(--muted); margin-top:8px; background:var(--bg); padding:8px 10px; border-radius:10px }
    .hint-box.ok { background:var(--green-soft); color:#166534; font-weight:600 }
    .hint-box.bad { background:var(--red-soft); color:#b42318 }
    .tag {
      display:inline-block; font-size:11px; font-weight:600; padding:3px 8px; border-radius:999px;
      background:var(--primary-soft); color:var(--primary); margin:0 4px 6px 0;
    }
    .spk {
      border:none; background:var(--primary-soft); color:var(--primary); border-radius:999px;
      font-size:13px; padding:2px 8px; margin-left:6px; cursor:pointer; vertical-align:middle;
      font-family:inherit; line-height:1.4;
    }
    .spk:active { transform:scale(.92) }
    #pop-mask {
      position:fixed; inset:0; background:rgba(26,34,51,.28); z-index:40;
    }
    #popover {
      position:fixed; left:14px; right:14px; bottom:16px; max-width:402px; margin:0 auto;
      background:#fff; border-radius:16px; box-shadow:0 12px 40px rgba(26,34,51,.18);
      padding:16px; z-index:50;
    }
    .pop-head { display:flex; justify-content:space-between; align-items:flex-start; gap:8px; margin-bottom:6px }
    .pop-word { font-size:20px; font-weight:700 }
    .pop-ipa { font-size:13px; color:var(--muted); margin-top:2px }
    .pop-gloss { font-size:16px; font-weight:700; margin:6px 0 10px }
    .badge { font-size:11px; font-weight:700; border-radius:999px; padding:3px 8px; white-space:nowrap }
    .badge-new { background:var(--primary-soft); color:var(--primary) }
    .badge-old { background:var(--bg); color:var(--muted) }
    .end-card h2 { font-size:20px; margin-bottom:8px }
    .end-note {
      margin-top:12px; background:var(--primary-soft); color:#334; border-radius:12px;
      padding:10px 12px; font-size:13px; line-height:1.6;
    }
    footer {
      margin:8px 14px 24px; font-size:11px; color:var(--muted); line-height:1.55;
    }
    footer a { color:var(--primary); text-decoration:none }
    footer a:hover { text-decoration:underline }
    [hidden] { display:none !important }
  </style>
</head>
<body>
  <div class="wrap">
    <header class="top">
      <div class="hi">英语小步走 · 试读</div>
      <h1>周六俱乐部</h1>
      <p class="sub">第1篇《黑板上的留言》</p>
      <p class="sub-en">Weekend 1: The Message on the Board</p>
    </header>
    <div id="main">
      <div class="notice">正在打开故事…</div>
    </div>
    <footer>
      词表来源（官方 PDF，本页不提供完整词表）：
      <a href="https://www.cambridgeenglish.org/images/506886-a2-key-2020-vocabulary-list.pdf" target="_blank" rel="noopener noreferrer">A2 Key vocabulary list (August 2025)</a>
    </footer>
  </div>
  <div id="pop-mask" hidden></div>
  <div id="popover" hidden role="dialog" aria-label="词义提示"></div>
  <script src="app.js" defer></script>
</body>
</html>
